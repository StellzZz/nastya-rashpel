<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>НАСТЯ DYNZOL2004</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .rainbow-text {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: bold;
            text-align: center;
            background: linear-gradient(
                to right,
                #ff0000,
                #ff7f00,
                #ffff00,
                #00ff00,
                #0000ff,
                #4b0082,
                #9400d3,
                #ff0000
            );
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 3s linear infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        @keyframes rainbow {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        .glow {
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
            }
            to {
                filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.8));
            }
        }
    </style>
</head>
<body>
    <div class="rainbow-text glow" onclick="openInfo()" style="cursor: pointer;">НАСТЯ ДУНЗОЛ2004</div>

    <script>
        function openInfo() {
            const infoWindow = window.open('', '_blank', 'width=600,height=400');
            infoWindow.document.write(`
                <!DOCTYPE html>
                <html lang="ru">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Информация о Насте</title>
                    <style>
                        body {
                            font-family: Arial, sans-serif;
                            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                            color: white;
                            padding: 40px;
                            margin: 0;
                            min-height: 100vh;
                        }
                        .info-container {
                            max-width: 600px;
                            margin: 0 auto;
                            background: rgba(255, 255, 255, 0.1);
                            padding: 30px;
                            border-radius: 15px;
                            backdrop-filter: blur(10px);
                            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
                        }
                        h1 {
                            text-align: center;
                            margin-bottom: 30px;
                            font-size: 2em;
                            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
                        }
                        .info-item {
                            margin: 20px 0;
                            font-size: 1.2em;
                            line-height: 1.6;
                        }
                        .number {
                            font-weight: bold;
                            color: #ffd700;
                            font-size: 1.3em;
                        }
                    </style>
                </head>
                <body>
                    <div class="info-container">
                        <h1>Информация о Насте</h1>
                        <div class="info-item">
                            <span class="number">1.</span> Инюшева Анастасия Александровна
                        </div>
                        <div class="info-item">
                            <span class="number">2.</span> Дата рождения: 25.05.2010г
                        </div>
                        <div class="info-item">
                            <span class="number">3.</span> Живет у себя в комнате и не вылазит из компуктера
                        </div>
                        <div class="info-item">
                            <span class="number">4.</span> Учится в СШ №8 г.Жодино
                        </div>
                        <div class="info-item">
                            <span class="number">5.</span> Погоняло ДУНЗОЛ2004
                        </div>
                    </div>
                </body>
                </html>
            `);
            infoWindow.document.close();
        }
    </script>
</body>
</html>
